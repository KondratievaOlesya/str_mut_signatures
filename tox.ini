[tox]
envlist = py38, py39, py310, py311, py312, py313
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest under {envname}
deps =
    pytest
    pytest-cov
    pytest-regressions
commands =
    pytest tests/ --cov=src/str_mut_signatures --cov-report=term-missing